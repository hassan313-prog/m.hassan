function today(){return new Date().toISOString().slice(0,10)}
function userBalance(id){const d=(cache.deposit_requests||[]).filter(x=>x.user_id===id&&['verified','approved'].includes(String(x.status).toLowerCase())).reduce((a,x)=>a+Number(x.amount||0),0);const spent=(cache.solar_plan_purchases||[]).filter(x=>x.user_id===id&&x.status==='completed'&&(x.wallet_source||'deposit')==='deposit').reduce((a,x)=>a+Number(x.amount_usd||0),0);const earned=(cache.earning_transactions||[]).filter(x=>x.user_id===id&&x.status==='approved').reduce((a,x)=>a+Number(x.amount_usd||0),0);const reserved=(cache.withdrawal_requests||[]).filter(x=>x.user_id===id&&['pending','approved','paid'].includes(String(x.status).toLowerCase())).reduce((a,x)=>a+Number(x.amount||0),0);const earnSpent=(cache.solar_plan_purchases||[]).filter(x=>x.user_id===id&&x.status==='completed'&&x.wallet_source==='earnings').reduce((a,x)=>a+Number(x.amount_usd||0),0);return {deposit:Math.max(0,d-spent),earning:Math.max(0,earned-reserved-earnSpent),total:Math.max(0,d-spent)+Math.max(0,earned-reserved-earnSpent)}}
function memberPlan(id){const p=(cache.solar_plan_purchases||[]).filter(x=>x.user_id===id&&x.status==='completed').sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];return p?p.plan_name:'No plan'}
function referralCount(id){const x=(cache.referral_stats||[]).find(r=>r.user_id===id);return x?Number(x.total_referrals||0):(cache.profiles||[]).filter(m=>m.referred_by===id).length}
function dashboard(){const m=(cache.profiles||[]).filter(x=>x.role==='member'),d=cache.deposit_requests||[],w=cache.withdrawal_requests||[],c=cache.referral_commissions||[],todayDeposits=d.filter(x=>['verified','approved'].includes(String(x.status).toLowerCase())&&String(x.created_at||'').slice(0,10)===today()).reduce((a,x)=>a+Number(x.amount||0),0),pendingW=w.filter(x=>x.status==='pending'),bonus=c.reduce((a,x)=>a+Number(x.amount_usd||0),0),lastD=d.slice(0,5),lastW=w.slice(0,5);return '<h2>Dashboard Overview</h2><div class="stats"><div class="stat"><small>Total Users</small><strong>'+m.length+'</strong></div><div class="stat"><small>Total Deposit Today</small><strong>'+money(todayDeposits)+'</strong></div><div class="stat"><small>Total Pending Withdraw</small><strong>'+money(pendingW.reduce((a,x)=>a+Number(x.amount||0),0))+'</strong></div><div class="stat"><small>Total Referral Bonus</small><strong>'+money(bonus)+'</strong></div></div><div class="section grid2"><div class="card"><div class="toolbar"><h3>Last 5 Deposits</h3><button class="secondary" data-goto="deposits">View all</button></div>'+table(['User','Amount','Method','Status'],lastD.map(x=>'<tr><td>'+esc(memberName(x.user_id))+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.payment_method)+'</td><td>'+status(x.status)+'</td></tr>'))+'</div><div class="card"><div class="toolbar"><h3>Last 5 Withdrawals</h3><button class="secondary" data-goto="withdrawals">View all</button></div>'+table(['User','Amount','Method','Status'],lastW.map(x=>'<tr><td>'+esc(memberName(x.user_id))+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.payment_method)+'</td><td>'+status(x.status)+'</td></tr>'))+'</div></div>'}
function memberName(id){const m=(cache.profiles||[]).find(x=>x.id===id);return m?(m.display_name||m.email||id):id}
function members(){const a=cache.profiles||[];return '<div class="toolbar"><h2>Members</h2><input id="memberSearch" placeholder="Search name, email or phone"></div><div id="memberTable">'+memberTable(a)+'</div>'}

function deposits(){const a=cache.deposit_requests||[];return '<h2>Deposit Requests</h2>'+table(['User','Amount','Method','Screenshot / Reference','Date','Status','Action'],a.map(x=>'<tr><td>'+esc(memberName(x.user_id))+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.payment_method)+'</td><td>'+esc(x.transaction_reference||'—')+(x.proof_path?'<br><button class="secondary" data-proof="'+esc(x.proof_path)+'">View screenshot</button>':'')+'</td><td>'+dt(x.created_at)+'</td><td>'+status(x.status)+'</td><td><div class="actions">'+(x.status==='pending'?'<button class="good" data-deposit="'+x.id+'" data-status="verified">Approve</button><button class="danger" data-deposit="'+x.id+'" data-status="rejected">Reject</button>':'—')+'</div></td></tr>'))}
function deposits(){const a=cache.deposit_requests||[];return '<h2>Deposit Requests</h2>'+table(['Member','Amount','Method','Reference','Status','Submitted','Action'],a.map(x=>'<tr><td>'+esc(memberName(x.user_id))+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.payment_method)+'</td><td>'+esc(x.transaction_reference)+'</td><td>'+status(x.status)+'</td><td>'+dt(x.created_at)+'</td><td><div class="actions">'+(x.status==='pending'?'<button class="good" data-deposit="'+x.id+'" data-status="verified">Approve</button><button class="danger" data-deposit="'+x.id+'" data-status="rejected">Reject</button>':'—')+'</div></td></tr>'))}
function withdrawals(){const a=cache.withdrawal_requests||[];return '<h2>Withdrawal Requests</h2>'+table(['User','Amount','Account Number','Date','Status','Action'],a.map(x=>'<tr><td>'+esc(memberName(x.user_id))+'<br><span class="muted">'+esc(x.payment_method)+'</span></td><td>'+money(x.amount)+'</td><td>'+esc(x.account_title)+'<br>'+esc(x.account_number)+'</td><td>'+dt(x.created_at)+'</td><td>'+status(x.status)+'</td><td><div class="actions">'+(x.status==='pending'?'<button class="good" data-withdraw="'+x.id+'" data-status="approved">Approve</button><button class="danger" data-withdraw="'+x.id+'" data-status="rejected">Reject</button>':x.status==='approved'?'<button data-withdraw="'+x.id+'" data-status="paid">Mark paid</button>':'—')+'</div></td></tr>'))}
function plans(){const a=cache.solar_plan_levels||[];return '<div class="toolbar"><h2>Solar Plans</h2><button id="newPlan">＋ Add Plan</button></div>'+table(['Level','Plan','Investment','Duration','Daily earning','Status','Action'],a.map(x=>'<tr><td>'+x.level_no+'</td><td>'+esc(x.plan_name)+'</td><td>'+money(x.amount_usd)+'</td><td>'+esc(x.duration_text)+'</td><td>'+money(x.daily_earning_usd)+'</td><td>'+status(x.is_active?'Active':'Hidden')+'</td><td><div class="actions"><button class="secondary" data-edit-plan="'+x.id+'">Edit</button><button class="'+(x.is_active?'danger':'good')+'" data-toggle-plan="'+x.id+'" data-active="'+(!x.is_active)+'">'+(x.is_active?'Hide':'Show')+'</button></div></td></tr>'))+'<div id="planForm" class="card section hidden"><h3 id="planFormTitle">Add plan</h3><form id="planEditForm" class="stack"><input type="hidden" name="id"><div class="formgrid"><label>Level number<input name="level_no" type="number" min="1" max="20" required></label><label>Plan name<input name="plan_name" required></label><label>Investment USD<input name="amount_usd" type="number" min="0" step=".01" required></label><label>Duration<input name="duration_text"></label><label>Daily earning USD<input name="daily_earning_usd" type="number" min="0" step=".01"></label><label>Benefits<input name="benefits_text"></label></div><div class="actions"><button>Save Plan</button><button type="button" class="secondary" id="cancelPlan">Cancel</button></div></form></div>'}
function transactions(){const rows=[];(cache.solar_plan_purchases||[]).forEach(x=>rows.push({type:'Plan purchase',user:x.user_id,amount:x.amount_usd,status:x.status,date:x.created_at,detail:x.plan_name}));(cache.earning_transactions||[]).forEach(x=>rows.push({type:'Earning',user:x.user_id,amount:x.amount_usd,status:x.status,date:x.created_at,detail:x.description}));(cache.deposit_requests||[]).forEach(x=>rows.push({type:'Deposit',user:x.user_id,amount:x.amount,status:x.status,date:x.created_at,detail:x.payment_method}));(cache.withdrawal_requests||[]).forEach(x=>rows.push({type:'Withdrawal',user:x.user_id,amount:x.amount,status:x.status,date:x.created_at,detail:x.payment_method}));rows.sort((a,b)=>new Date(b.date)-new Date(a.date));return '<h2>Transactions History</h2>'+table(['Type','Member','Detail','Amount','Status','Date'],rows.map(x=>'<tr><td>'+x.type+'</td><td>'+esc(memberName(x.user))+'</td><td>'+esc(x.detail)+'</td><td>'+money(x.amount)+'</td><td>'+status(x.status)+'</td><td>'+dt(x.date)+'</td></tr>'))}
function settings(){const p=cache.payment_settings||[],s=(cache.site_settings||[])[0]||{},e=(cache.earning_settings||[])[0]||{};return '<h2>Settings</h2><div class="card section"><h3>Website Settings</h3><form id="siteForm" class="stack"><label>WhatsApp Number<input name="whatsapp_number" value="'+esc(s.whatsapp_number||'')+'"></label><label><span>Maintenance mode</span><select name="maintenance_mode"><option value="false" '+(!s.maintenance_mode?'selected':'')+'>Off</option><option value="true" '+(s.maintenance_mode?'selected':'')+'>On</option></select></label><button>Save website settings</button></form></div><div class="card section"><h3>Referral Bonus</h3><form id="earningForm" class="stack"><label>Referral bonus percent (default 10%)<input name="referral_bonus_percent" type="number" min="0" max="100" step=".01" value="'+Number(e.referral_bonus_percent??10)+'"></label><label>Fixed referral commission USD<input name="referral_commission_usd" type="number" min="0" step=".01" value="'+Number(e.referral_commission_usd||0)+'"></label><button>Save referral settings</button></form><p class="muted small">Commission history is recorded in Referral Commissions and included in dashboard totals.</p></div><div class="section"><div class="toolbar"><h3>Payment Methods</h3><button id="addPayment">＋ Add Method</button></div>'+table(['Method','Account title','Account number','Enabled','Action'],p.map(x=>'<tr><td>'+esc(x.method)+'</td><td>'+esc(x.account_title)+'</td><td>'+esc(x.account_number)+'</td><td>'+status(x.is_enabled?'Enabled':'Disabled')+'</td><td><div class="actions"><button class="secondary" data-payment-edit="'+x.id+'">Edit</button><button class="'+(x.is_enabled?'danger':'good')+'" data-payment-toggle="'+x.id+'" data-active="'+(!x.is_enabled)+'">'+(x.is_enabled?'Disable':'Enable')+'</button></div></td></tr>'))+'</div><div id="paymentForm" class="card section hidden"><h3>Payment method</h3><form id="paymentEditForm" class="stack"><input type="hidden" name="id"><div class="formgrid"><label>Method name<input name="method" required></label><label>Account title<input name="account_title"></label><label>Account number<input name="account_number"></label><label>Instructions<input name="instructions"></label></div><label>Enabled<select name="is_enabled"><option value="true">Yes</option><option value="false">No</option></select></label><div class="actions"><button>Save method</button><button type="button" id="cancelPayment" class="secondary">Cancel</button></div></form></div>'}

$('#content').querySelectorAll('[data-adjust]').forEach(b=>b.onclick=async()=>{const amount=Number(prompt('Enter USD amount to '+b.dataset.kind+':',''));if(!Number.isFinite(amount)||amount<=0)return;const note=prompt('Reason for this adjustment:','');if(note===null)return;await act(async()=>db.from('admin_balance_adjustments').insert({user_id:b.dataset.adjust,amount_usd:b.dataset.kind==='credit'?amount:-amount,note,created_by:user.id}))});

const search=$('#memberSearch');if(search)search.oninput=()=>{$('#memberTable').innerHTML=memberTable((cache.profiles||[]).filter(x=>(x.display_name+' '+x.email+' '+x.mobile_number).toLowerCase().includes(search.value.toLowerCase())))};
$('#newPlan')?.addEventListener('click',()=>showPlan());$('#cancelPlan')?.addEventListener('click',()=>$('#planForm').classList.add('hidden'));
$('#content').querySelectorAll('[data-edit-plan]').forEach(b=>b.onclick=()=>showPlan((cache.solar_plan_levels||[]).find(x=>x.id===b.dataset.editPlan)));
$('#content').querySelectorAll('[data-toggle-plan]').forEach(b=>b.onclick=async()=>{await act(async()=>db.from('solar_plan_levels').update({is_active:b.dataset.active==='true',updated_at:new Date().toISOString()}).eq('id',b.dataset.togglePlan));});
$('#planEditForm')?.addEventListener('submit',async ev=>{ev.preventDefault();const f=new FormData(ev.target),id=f.get('id'),v={level_no:Number(f.get('level_no')),plan_name:f.get('plan_name'),amount_usd:Number(f.get('amount_usd')),duration_text:f.get('duration_text'),daily_earning_usd:Number(f.get('daily_earning_usd')||0),benefits_text:f.get('benefits_text'),updated_at:new Date().toISOString()};await act(async()=>id?db.from('solar_plan_levels').update(v).eq('id',id):db.from('solar_plan_levels').insert(v));});
$('#siteForm')?.addEventListener('submit',async ev=>{ev.preventDefault();const f=new FormData(ev.target),v={whatsapp_number:f.get('whatsapp_number'),maintenance_mode:f.get('maintenance_mode')==='true',updated_at:new Date().toISOString(),updated_by:user.id};await act(async()=>db.from('site_settings').upsert({id:true,...v}));});
$('#earningForm')?.addEventListener('submit',async ev=>{ev.preventDefault();const f=new FormData(ev.target),v={id:true,referral_commission_usd:Number(f.get('referral_commission_usd')),referral_bonus_percent:Number(f.get('referral_bonus_percent')),updated_at:new Date().toISOString(),updated_by:user.id};await act(async()=>db.from('earning_settings').upsert(v));});
$('#addPayment')?.addEventListener('click',()=>showPayment());$('#cancelPayment')?.addEventListener('click',()=>$('#paymentForm').classList.add('hidden'));
$('#content').querySelectorAll('[data-payment-edit]').forEach(b=>b.onclick=()=>showPayment((cache.payment_settings||[]).find(x=>x.id===b.dataset.paymentEdit)));
$('#content').querySelectorAll('[data-payment-toggle]').forEach(b=>b.onclick=async()=>{await act(async()=>db.from('payment_settings').update({is_enabled:b.dataset.active==='true',updated_at:new Date().toISOString()}).eq('id',b.dataset.paymentToggle));});
$('#paymentEditForm')?.addEventListener('submit',async ev=>{ev.preventDefault();const f=new FormData(ev.target),id=f.get('id'),v={method:f.get('method'),account_title:f.get('account_title'),account_number:f.get('account_number'),instructions:f.get('instructions'),is_enabled:f.get('is_enabled')==='true',updated_at:new Date().toISOString()};await act(async()=>id?db.from('payment_settings').update(v).eq('id',id):db.from('payment_settings').insert(v));});
}
function showPlan(x={}){const f=$('#planEditForm');f.elements.id.value=x.id||'';['level_no','plan_name','amount_usd','duration_text','daily_earning_usd','benefits_text'].forEach(k=>f.elements[k].value=x[k]??'');$('#planFormTitle').textContent=x.id?'Edit plan':'Add plan';$('#planForm').classList.remove('hidden');$('#planForm').scrollIntoView({behavior:'smooth'});}
function showPayment(x={}){const f=$('#paymentEditForm');['id','method','account_title','account_number','instructions'].forEach(k=>f.elements[k].value=x[k]||'');f.elements.is_enabled.value=String(x.is_enabled??true);$('#paymentForm').classList.remove('hidden');$('#paymentForm').scrollIntoView({behavior:'smooth'});}
async function act(fn){try{const {error}=await fn();if(error)throw error;await refresh();renderPage()}catch(e){alert(e.message||'Action failed')}}
async function startApp(){const {data:{session}}=await db.auth.getSession();if(!session){$('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden');return}const {data:p,error}=await db.from('profiles').select('*').eq('id',session.user.id).single();if(error||!p||p.role!=='admin'||!p.is_active){await db.auth.signOut();$('#loginMsg').textContent='Access denied. This login is restricted to active administrators.';$('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden');return}user=session.user;profile=p;$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#adminEmail').textContent=session.user.email||p.email||'Administrator';try{await refresh();renderPage()}catch(e){$('#content').innerHTML=msg('Unable to load admin data: '+e.message,true)}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginBtn').disabled=true;$('#loginBtn').textContent='Checking…';$('#loginMsg').textContent='';const {error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#loginBtn').disabled=false;$('#loginBtn').textContent='Secure Admin Login';if(error){$('#loginMsg').textContent=error.message;return}await startApp()};
$('#logout').onclick=async()=>{await db.auth.signOut();user=null;profile=null;startApp()};
$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
db.auth.onAuthStateChange((_event)=>{if(_event==='SIGNED_OUT'){user=null;$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden')}});
startApp();
</script></body></html>
