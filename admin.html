<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b14"><title>SolarNova Admin</title>
<style>
:root{--bg:#071b14;--panel:#10291f;--panel2:#153629;--line:#28503d;--gold:#e5bd63;--text:#f4f5ed;--muted:#a8b8ac;--red:#d96d65;--green:#7ac49a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#123a28 0,#071b14 55%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--gold);color:#1b2419;font-weight:700;padding:10px 14px}button.secondary{background:#183a2b;color:var(--text)}button.danger{background:#542b29;color:#ffd8d4;border-color:#75413d}button:disabled{opacity:.5;cursor:wait}.hidden{display:none!important}.wrap{max-width:1400px;margin:auto;padding:22px}.login{max-width:420px;margin:9vh auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 24px 80px #0005}.brand{color:var(--gold);font-weight:900;letter-spacing:2px;font-size:13px}.login h1{margin:8px 0 24px;font-size:28px}.field{display:grid;gap:7px;margin:14px 0}.field label{color:var(--muted);font-size:13px}.field input,.field select,.field textarea{width:100%;background:#081c14;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);outline:none}.error{color:#ffaaa4;min-height:22px;font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.top h1{font-size:23px;margin:4px 0}.top small{color:var(--muted)}.layout{display:grid;grid-template-columns:220px 1fr;gap:20px}.side,.main,.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}.side{padding:12px;height:max-content;position:sticky;top:12px}.nav{display:grid;gap:6px}.nav button{text-align:left;background:transparent;color:var(--muted);border-color:transparent}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--gold);border-color:var(--line)}.main{padding:20px;min-width:0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat{padding:16px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:8px;color:var(--gold)}.panel{padding:16px;margin:14px 0}.panel h2{font-size:17px;margin:0 0 14px}.muted{color:var(--muted)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{color:var(--gold);font-weight:700}td{color:#e5ece5}.pill{display:inline-block;padding:4px 8px;border-radius:30px;background:#244735;color:#cce6d4;font-size:11px}.pill.pending{background:#574627;color:#ffe0a0}.pill.rejected{background:#542b29;color:#ffd0ca}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:12px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{max-width:280px;background:#081c14;color:white;border:1px solid var(--line);padding:10px;border-radius:9px}.toast{padding:10px 12px;border-radius:9px;background:#183b2b;color:#c9f0d4;margin:10px 0}.empty{padding:25px;text-align:center;color:var(--muted)}.mobilebar{display:none}
@media(max-width:850px){.wrap{padding:12px}.layout{grid-template-columns:1fr}.side{position:static}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:13px}.top{align-items:flex-start}.top h1{font-size:20px}}@media(max-width:420px){.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.top{flex-direction:column}}
</style></head><body>
<div id="login" class="login"><div class="brand">SOLARNOVA • CONTROL</div><h1>Admin Login</h1><form id="loginForm"><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="username" required placeholder="Admin email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Password"></div><button id="loginBtn" type="submit" style="width:100%">Sign in to Admin</button><div id="loginError" class="error"></div></form></div>
<div id="app" class="wrap hidden"><header class="top"><div><div class="brand">SOLARNOVA • ADMIN CONTROL PANEL</div><h1 id="pageTitle">Dashboard</h1><small id="who"></small></div><div class="actions"><button class="secondary" id="refresh">Refresh</button><button class="danger" id="logout">Log out</button></div></header>
<div class="layout"><aside class="side"><nav class="nav" id="nav"><button data-tab="dashboard" class="active">▦ Dashboard</button><button data-tab="members">♙ Members</button><button data-tab="deposits">⇩ Deposits</button><button data-tab="withdrawals">⇧ Withdrawals</button><button data-tab="plans">▤ Solar Plans</button><button data-tab="purchases">◈ Plan Purchases</button><button data-tab="payments">◎ Payment Methods</button><button data-tab="settings">⚙ Site Settings</button></nav></aside><main class="main"><div id="content"><div class="empty">Loading admin data…</div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient('https://hxhbiqymnmcwuvngzsxh.supabase.co','sb_publishable__xw-SRTVHzF4sCtfTxjKdw_dt56TDE-');
const $=id=>document.getElementById(id);let user=null,profile=null,tab='dashboard',cache={};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const date=v=>v?new Date(v).toLocaleString():'—';
function pill(s){let x=String(s||'pending').toLowerCase();return '<span class="pill '+(x==='pending'?'pending':x==='rejected'?'rejected':'')+'">'+esc(x)+'</span>'}
function notify(m){let el=document.createElement('div');el.className='toast';el.textContent=m;$('content').prepend(el);setTimeout(()=>el.remove(),3500)}
async function adminCheck(){const {data,error}=await db.from('profiles').select('id,email,display_name,role,is_active').eq('id',user.id).maybeSingle();if(error||!data||data.role!=='admin'||data.is_active!==true){await db.auth.signOut();throw new Error('This account does not have active administrator access.');}profile=data}
async function load(){const names=['profiles','deposit_requests','withdrawal_requests','solar_plan_levels','solar_plan_purchases','payment_settings','site_settings','membership_payment_submissions','earning_transactions','investment_transactions','referral_commissions'];const queries=names.map(n=>db.from(n).select('*').order('created_at',{ascending:false}).limit(500));const results=await Promise.all(queries);cache={};results.forEach((r,i)=>{if(!r.error)cache[names[i]]=r.data||[];else cache[names[i]]=[]});const {data:site}=await db.from('site_settings').select('*').eq('id',true).maybeSingle();cache.site=site||null;render()}
function stat(label,value){return '<div class="stat"><span>'+label+'</span><strong>'+value+'</strong></div>'}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+ (rows||[]).join('')+'</tbody></table></div>'}
function rowEmpty(n){return '<tr><td colspan="'+n+'" class="empty">No records found.</td></tr>'}
function dashboard(){let m=cache.profiles||[],d=cache.deposit_requests||[],w=cache.withdrawal_requests||[],p=cache.solar_plan_purchases||[];let pending=d.filter(x=>x.status==='pending').length+ w.filter(x=>['pending','approved'].includes(x.status)).length;return '<div class="stats">'+stat('Total Members',m.length)+stat('Pending Requests',pending)+stat('Deposits Received',money(d.filter(x=>x.status==='verified').reduce((a,x)=>a+Number(x.amount||0),0)))+stat('Active Plan Purchases',p.filter(x=>x.status==='active'||x.status==='approved').length)+'</div><div class="panel"><h2>Recent Deposit Requests</h2>'+table(['Member ID','Amount','Method','Reference','Status','Date'],d.slice(0,6).map(x=>'<tr><td>'+esc(x.user_id)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.payment_method)+'</td><td>'+esc(x.transaction_reference)+'</td><td>'+pill(x.status)+'</td><td>'+date(x.created_at)+'</td></tr>') .join('')||rowEmpty(6))+'</div><div class="panel"><h2>Recent Withdrawal Requests</h2>'+table(['Member ID','Amount','Method','Account','Status','Date'],w.slice(0,6).map(x=>'<tr><td>'+esc(x.user_id)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.payment_method)+'</td><td>'+esc(x.account_number)+'</td><td>'+pill(x.status)+'</td><td>'+date(x.created_at)+'</td></tr>').join('')||rowEmpty(6))+'</div>'}
function members(){return '<div class="panel"><div class="toolbar"><h2>Member Accounts</h2><input id="search" placeholder="Search name or email…"></div><div id="memberTable">'+table(['Name','Email','Role','Status','Joined','Action'],(cache.profiles||[]).map(m=>'<tr><td>'+esc(m.display_name||'—')+'</td><td>'+esc(m.email||'—')+'</td><td>'+pill(m.role)+'</td><td>'+pill(m.is_active?'active':'inactive')+'</td><td>'+date(m.created_at)+'</td><td><button class="'+(m.is_active?'danger':'secondary')+'" data-member="'+m.id+'" data-next="'+(!m.is_active)+'">'+(m.is_active?'Block':'Activate')+'</button></td></tr>').join('')||rowEmpty(6))+'</div></div>'}
function deposits(){return '<div class="panel"><h2>Deposit Requests</h2>'+table(['Member ID','Amount','Method','Transaction Ref','Proof','Status','Submitted','Action'],(cache.deposit_requests||[]).map(x=>'<tr><td>'+esc(x.user_id)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.payment_method)+'</td><td>'+esc(x.transaction_reference)+'</td><td>'+(x.proof_path?'<button class="secondary" data-proof="'+esc(x.proof_path)+'">View proof</button>':'—')+'</td><td>'+pill(x.status)+'</td><td>'+date(x.created_at)+'</td><td>'+(x.status==='pending'?'<div class="actions"><button data-deposit="'+x.id+'" data-status="verified">Approve</button><button class="danger" data-deposit="'+x.id+'" data-status="rejected">Reject</button></div>':'—')+'</td></tr>').join('')||rowEmpty(8))+'</div>'}
function withdrawals(){return '<div class="panel"><h2>Withdrawal Requests</h2>'+table(['Member ID','Amount','Method','Account Title','Account / Wallet','Status','Submitted','Action'],(cache.withdrawal_requests||[]).map(x=>'<tr><td>'+esc(x.user_id)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.payment_method)+'</td><td>'+esc(x.account_title)+'</td><td>'+esc(x.account_number)+'</td><td>'+pill(x.status)+'</td><td>'+date(x.created_at)+'</td><td>'+(x.status==='pending'||x.status==='approved'?'<div class="actions"><button data-withdraw="'+x.id+'" data-status="paid">'+(x.status==='approved'?'Mark paid':'Confirm paid')+'</button><button class="danger" data-withdraw="'+x.id+'" data-status="rejected">Reject & release</button></div>':'—')+'</td></tr>').join('')||rowEmpty(8))+'</div>'}
function plans(){return '<div class="panel"><h2>Solar Plan Levels</h2>'+table(['Level','Plan','Investment','Duration','Daily Earning','Benefits','Status','Action'],(cache.solar_plan_levels||[]).map(x=>'<tr><td>'+esc(x.level_no)+'</td><td>'+esc(x.plan_name)+'</td><td>'+money(x.amount_usd)+'</td><td>'+esc(x.duration_text)+'</td><td>'+money(x.daily_earning_usd)+'</td><td>'+esc(x.benefits_text)+'</td><td>'+pill(x.is_active?'active':'inactive')+'</td><td><button class="secondary" data-plan="'+x.id+'" data-next="'+(!x.is_active)+'">'+(x.is_active?'Disable':'Enable')+'</button></td></tr>').join('')||rowEmpty(8))+'</div>'}
function purchases(){return '<div class="panel"><h2>Member Plan Purchases</h2>'+table(['Member ID','Plan','Amount','Wallet','Status','Date'],(cache.solar_plan_purchases||[]).map(x=>'<tr><td>'+esc(x.user_id)+'</td><td>'+esc(x.plan_name)+'</td><td>'+money(x.amount_usd)+'</td><td>'+esc(x.wallet_source||'—')+'</td><td>'+pill(x.status)+'</td><td>'+date(x.created_at)+'</td></tr>').join('')||rowEmpty(6))+'</div>'}
function payments(){return '<div class="panel"><h2>Payment Methods</h2>'+table(['Method','Account Title','Account Number','Instructions','Status','Action'],(cache.payment_settings||[]).map(x=>'<tr><td>'+esc(x.method)+'</td><td>'+esc(x.account_title)+'</td><td>'+esc(x.account_number)+'</td><td>'+esc(x.instructions)+'</td><td>'+pill(x.is_enabled?'enabled':'disabled')+'</td><td><button class="secondary" data-payment="'+x.id+'" data-next="'+(!x.is_enabled)+'">'+(x.is_enabled?'Disable':'Enable')+'</button></td></tr>').join('')||rowEmpty(6))+'</div>'}
function settings(){let x=cache.site||{};return '<div class="panel"><h2>Site Settings</h2><p class="muted">These settings are stored in the existing SolarNova database.</p><div class="field"><label>WhatsApp Number</label><input id="wa" value="'+esc(x.whatsapp_number||'')+'" placeholder="WhatsApp number"></div><div class="field"><label>Maintenance Mode</label><select id="maintenance"><option value="false" '+(!x.maintenance_mode?'selected':'')+'>Off</option><option value="true" '+(x.maintenance_mode?'selected':'')+'>On</option></select></div><button id="saveSettings">Save Settings</button></div><div class="panel"><h2>Admin Session</h2><p>'+esc(profile.email||user.email)+'</p><p class="muted">Role: Administrator · Protected by Supabase Auth and database Row Level Security.</p></div>'}
function render(){const titles={dashboard:'Dashboard',members:'Members',deposits:'Deposits',withdrawals:'Withdrawals',plans:'Solar Plans',purchases:'Plan Purchases',payments:'Payment Methods',settings:'Site Settings'};$('pageTitle').textContent=titles[tab];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let f={dashboard,members,deposits,withdrawals,plans,purchases,payments,settings};$('content').innerHTML=f[tab]()}
async function update(tableName,id,patch){const {error}=await db.from(tableName).update({...patch,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await load()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;$('loginError').textContent='Checking admin access…';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent=error.message;$('loginBtn').disabled=false;return}user=data.user;try{await adminCheck();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=profile.email||user.email;await load()}catch(err){$('loginError').textContent=err.message;$('loginBtn').disabled=false}});
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;render()});
$('refresh').onclick=()=>load();$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
$('content').addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;try{
if(b.dataset.member){if(!confirm((b.dataset.next==='true'?'Activate':'Block')+' this member account?'))return;await update('profiles',b.dataset.member,{is_active:b.dataset.next==='true'});notify('Member status updated.')}
if(b.dataset.deposit){let status=b.dataset.status;let note=prompt(status==='verified'?'Optional approval note:':'Reason for rejecting this deposit:','');if(note===null)return;const {error}=await db.from('deposit_requests').update({status,admin_note:note.trim(),updated_at:new Date().toISOString()}).eq('id',b.dataset.deposit);if(error)throw error;await load();notify('Deposit request updated.')}
if(b.dataset.withdraw){let status=b.dataset.status;if(!confirm(status==='paid'?'Confirm that the withdrawal has actually been paid?':'Reject this withdrawal and release the reserved amount?'))return;const {error}=await db.from('withdrawal_requests').update({status,updated_at:new Date().toISOString()}).eq('id',b.dataset.withdraw);if(error)throw error;await load();notify('Withdrawal request updated.')}
if(b.dataset.plan){await update('solar_plan_levels',b.dataset.plan,{is_active:b.dataset.next==='true'});notify('Plan availability updated.')}
if(b.dataset.payment){await update('payment_settings',b.dataset.payment,{is_enabled:b.dataset.next==='true'});notify('Payment method updated.')}
if(b.dataset.proof){const {data,error}=await db.storage.from('payment-proofs').createSignedUrl(b.dataset.proof,60);if(error)throw error;window.open(data.signedUrl,'_blank','noopener')}
}catch(err){alert(err.message||String(err))}});
$('content').addEventListener('click',async e=>{if(e.target.id==='saveSettings'){try{let {error}=await db.from('site_settings').upsert({id:true,whatsapp_number:$('wa').value.trim(),maintenance_mode:$('maintenance').value==='true',updated_by:user.id,updated_at:new Date().toISOString()});if(error)throw error;await load();notify('Site settings saved.')}catch(err){alert(err.message)}}});
$('content').addEventListener('input',e=>{if(e.target.id==='search'){let q=e.target.value.toLowerCase();document.querySelectorAll('#memberTable tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none')}});
db.auth.getSession().then(async({data})=>{if(data.session){user=data.session.user;try{await adminCheck();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=profile.email||user.email;await load()}catch(e){await db.auth.signOut()}}});
</script></body></html>
